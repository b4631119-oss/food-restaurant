<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Проверка PDF меню Sushi Bar №1</title>
  <style>
    body{margin:0;padding:24px;background:#111827;color:#f9fafb;font:16px/1.45 system-ui,sans-serif}
    h1,h2{margin:0 0 16px}p{color:#cbd5e1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
    figure{margin:0;padding:12px;border:1px solid #334155;border-radius:12px;background:#1e293b}img{display:block;max-width:100%;height:auto;margin:auto}figcaption{margin-top:8px;color:#cbd5e1;font-size:14px}
    .pages img{width:100%;max-width:600px}.photos img{width:100%;max-width:500px}
  </style>
</head>
<body>
  <h1>Визуальная проверка меню Sushi Bar №1</h1>
  <p>Исходный PDF — 20 страниц. Сверяйте элементы каждого контактного листа с номером PDF-страницы и ID встроенного изображения.</p>
  <h2>Все страницы</h2>
  <div class="grid pages"><figure><img src="contact-sheet-all-pages.jpg" alt="Контактный лист всех 20 страниц меню"><figcaption>20 страниц; уменьшенный масштаб для обзора порядка и структуры.</figcaption></figure></div>
  <h2>Встроенные изображения меньшего размера</h2>
  <div class="grid photos">
    <figure><img src="contact-sheet-photos-1.jpg" alt="Изображения PDF 1"><figcaption>Изображения 1–32; подписи: страница PDF, объект, пиксельный размер, имя файла.</figcaption></figure>
    <figure><img src="contact-sheet-photos-2.jpg" alt="Изображения PDF 2"><figcaption>Изображения 33–64.</figcaption></figure>
    <figure><img src="contact-sheet-photos-3.jpg" alt="Изображения PDF 3"><figcaption>Изображения 65–96.</figcaption></figure>
    <figure><img src="contact-sheet-photos-4.jpg" alt="Изображения PDF 4"><figcaption>Изображения 97–110.</figcaption></figure>
  </div>
</body>
</html>
