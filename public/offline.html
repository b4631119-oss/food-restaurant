<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1424" />
    <title>Нет соединения | Sushi Bar №1</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a1424;
        color: #e8eef7;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 9999px;
        display: grid;
        place-items: center;
        background: rgba(233, 184, 69, 0.12);
        font-size: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: #93a1b5;
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        width: 100%;
        padding: 12px 24px;
        border: 0;
        border-radius: 12px;
        background: #e9b845;
        color: #0a1424;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>Нет соединения</h1>
      <p>Проверьте интернет и повторите.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
